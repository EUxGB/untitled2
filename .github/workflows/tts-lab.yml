name: Образцы синтеза речи (сравнение)
on:
  push:
    branches: [tts-lab]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        eng: [piper, mms, xtts, f5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ffmpeg -loglevel error -y -i ref/ref.mp3 -ac 1 -ar 24000 ref/ref.wav
      - name: Установка
        run: |
          pip install -q numpy soundfile huggingface_hub
          case "${{ matrix.eng }}" in
            piper) pip install -q piper-tts==1.2.0 || pip install -q piper-tts ;;
            mms)   pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers ;;
            xtts)  pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q coqui-tts ;;
            f5)    pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q f5-tts ;;
          esac
      - name: Озвучка
        env: { COQUI_TOS_AGREED: "1" }
        run: python tts_lab.py ${{ matrix.eng }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.eng }}", path: out, if-no-files-found: ignore }
  publish:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: arts, merge-multiple: true }
      - name: Положить в ветку tts-samples
        run: |
          mkdir pub && cp arts/*.mp3 arts/*.txt pub/ 2>/dev/null || true; cp ref/native_*.mp3 texts.txt pub/
          cd pub && git init -q && git checkout -q -b tts-samples
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Образцы синтеза" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" tts-samples
