name: Тесты и публикация
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)
        timeout-minutes: 12
      - name: npm test (ошибки — в аннотации запуска)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || { grep -E '✗|ожидалось|получено|Error|Итог|условие' test-output.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Снимок вида при падении эталона — в ветку approved-actual
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob; f=(tests/approved/*.actual.png); [ ${#f[@]} -gt 0 ] || exit 0
          mkdir -p /tmp/aa && cp "${f[@]}" /tmp/aa/ && cd /tmp/aa && git init -q && git checkout -q -b approved-actual && git config user.name ci && git config user.email ci@example.com
          git add . && git commit -q -m "снимок вида из CI для эталона" && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" approved-actual
  # Озвучка Piper (спек docs/superpowers/specs/2026-10-08-piper-tts-design.md): недостающие тексты озвучиваются и проверяются Whisper,
  # результат — ветка tts-audio. Сбой этой задачи публикацию не останавливает: на сайте для новых текстов будет голос телефона.
  tts:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    concurrency: { group: tts-audio, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)
        timeout-minutes: 12
      - run: node tests/tts-texts.js
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -qq ffmpeg && pip install -q piper-tts==1.2.0 faster-whisper huggingface_hub num2words
      - name: Ветка tts-audio
        run: git clone -q --depth 1 -b tts-audio "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" tts-audio || (mkdir tts-audio && cd tts-audio && git init -q && git checkout -q -b tts-audio)
      - name: Озвучить новые тексты (не больше 150 за публикацию)
        env: { TTS_MAX: "150" }
        run: python3 tests/tts-build.py tests/tts-texts.json tts-audio
      - name: Сохранить ветку tts-audio
        shell: bash
        run: |
          cd tts-audio && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && (git commit -qm "Озвучка Piper для ${GITHUB_SHA::7}" || true)
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:tts-audio
  # Публикация на GitHub Pages — только если все тесты прошли
  deploy:
    needs: [test, tts]
    timeout-minutes: 10
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт (только файлы приложения)
        run: |
          mkdir _site && cp -r index.html manifest.json icon-*.png fonts audio _site/
          # озвучка Piper из ветки tts-audio (нет ветки — сайт говорит голосом телефона)
          if git clone -q --depth 1 -b tts-audio "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/tta; then
            mkdir -p _site/tts && cp /tmp/tta/manifest.json /tmp/tta/*.mp3 _site/tts/ && echo "озвучка: $(ls _site/tts/*.mp3 | wc -l) файлов"
          fi
          # номер сборки: приложение сверяет его с сайтом и само подтягивает свежую версию
          BUILD="$(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" _site/index.html
          grep -c "$BUILD" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
  # Проверка «на самом деле»: сайт действительно отдаёт эту сборку и её шрифты (не просто «deploy: success»)
  verify:
    needs: deploy
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Сайт отдаёт новую сборку
        shell: bash
        run: |
          URL="https://www.simitci.ru"
          for i in $(seq 1 40); do
            # сначала в переменную: «curl | grep -q» при pipefail ложно падает (grep закрывает трубу раньше, curl получает SIGPIPE)
            PAGE="$(curl -fsS "$URL/index.html?v=$GITHUB_SHA-$i" || true)"
            if [[ "$PAGE" == *"· ${GITHUB_SHA::7}"* ]]; then echo "сборка ${GITHUB_SHA::7} на сайте (попытка $i)"; break; fi
            [ "$i" = 40 ] && { echo "::error::Через 10 минут сайт всё ещё отдаёт старую сборку"; exit 1; }
            sleep 15
          done
          for f in fonts/DejaVuSans.woff2 fonts/DejaVuSans-Bold.woff2 fonts/LiberationSerif-Regular.woff2 fonts/LiberationSerif-Bold.woff2 manifest.json audio/cv/index.json audio/cv/001.mp3; do
            curl -fsS -o /dev/null "$URL/$f?v=$GITHUB_SHA" || { echo "::error::нет файла $f на сайте"; exit 1; }
          done
          # озвучка Piper: манифест и 20 случайных файлов отдаются сайтом
          MAN="$(curl -fsS "$URL/tts/manifest.json?v=$GITHUB_SHA" || true)"
          if [ -z "$MAN" ]; then echo "::warning::на сайте нет tts/manifest.json — озвучка Piper не опубликована"; else
            echo "$MAN" | python3 -c "import sys,json,random;v=list(json.load(sys.stdin)['items'].values());random.shuffle(v);print('\n'.join(v[:20]))" > /tmp/ttsf
            echo "в манифесте: $(echo "$MAN" | python3 -c "import sys,json;print(len(json.load(sys.stdin)['items']))") текстов"
            while read -r f; do curl -fsS -o /dev/null "$URL/tts/$f?v=$GITHUB_SHA" || { echo "::error::нет файла озвучки tts/$f"; exit 1; }; done < /tmp/ttsf
          fi
  # Снимки живого сайта во всех разделах → ветка `screens` (чтобы показать пользователю, как сайт выглядит на самом деле)
  screens:
    needs: verify
    timeout-minutes: 35
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)
        timeout-minutes: 12
      - name: Снять живой сайт
        run: node tests/live-screens.js "https://www.simitci.ru/?v=$GITHUB_SHA" shots
      - name: Проверить внешние сервисы (Tatoeba, MyMemory, YouGlish)
        run: node tests/probe-services.js shots || true
      - name: Common Voice — сколько фраз записано носителями
        run: pip install -q pyarrow huggingface_hub && timeout 900 python3 tests/cv-scan.py shots || true
      - name: Сохранить в ветку screens
        shell: bash
        run: |
          cd shots && git init -q && git checkout -q -b screens
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Снимки живого сайта для ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screens
