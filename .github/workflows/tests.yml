name: Тесты и публикация
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)
        timeout-minutes: 12
      - name: npm test (ошибки — в аннотации запуска)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || { grep -E '✗|ожидалось|получено|Error|Итог|условие' test-output.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
  # Публикация на GitHub Pages — только если все тесты прошли
  deploy:
    needs: test
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт (только файлы приложения)
        run: |
          mkdir _site && cp -r index.html manifest.json icon-*.png fonts _site/
          # номер сборки: приложение сверяет его с сайтом и само подтягивает свежую версию
          BUILD="$(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" _site/index.html
          grep -c "$BUILD" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
  # Проверка «на самом деле»: сайт действительно отдаёт эту сборку и её шрифты (не просто «deploy: success»)
  verify:
    needs: deploy
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Сайт отдаёт новую сборку
        shell: bash
        run: |
          URL="https://euxgb.github.io/untitled2"
          for i in $(seq 1 40); do
            # сначала в переменную: «curl | grep -q» при pipefail ложно падает (grep закрывает трубу раньше, curl получает SIGPIPE)
            PAGE="$(curl -fsS "$URL/index.html?v=$GITHUB_SHA-$i" || true)"
            if [[ "$PAGE" == *"· ${GITHUB_SHA::7}"* ]]; then echo "сборка ${GITHUB_SHA::7} на сайте (попытка $i)"; break; fi
            [ "$i" = 40 ] && { echo "::error::Через 10 минут сайт всё ещё отдаёт старую сборку"; exit 1; }
            sleep 15
          done
          for f in fonts/DejaVuSans.woff2 fonts/DejaVuSans-Bold.woff2 fonts/LiberationSerif-Regular.woff2 fonts/LiberationSerif-Bold.woff2 manifest.json; do
            curl -fsS -o /dev/null "$URL/$f?v=$GITHUB_SHA" || { echo "::error::нет файла $f на сайте"; exit 1; }
          done
  # Снимки живого сайта во всех разделах → ветка `screens` (чтобы показать пользователю, как сайт выглядит на самом деле)
  screens:
    needs: verify
    timeout-minutes: 35
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)
        timeout-minutes: 12
      - name: Снять живой сайт
        run: node tests/live-screens.js "https://euxgb.github.io/untitled2/?v=$GITHUB_SHA" shots
      - name: Проверить внешние сервисы (Tatoeba, MyMemory, YouGlish)
        run: node tests/probe-services.js shots || true
      - name: Common Voice — сколько фраз записано носителями
        run: pip install -q pyarrow huggingface_hub && timeout 900 python3 tests/cv-scan.py shots || true
      - name: Сохранить в ветку screens
        shell: bash
        run: |
          cd shots && git init -q && git checkout -q -b screens
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Снимки живого сайта для ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screens
