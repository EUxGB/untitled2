name: Кандидаты в фразы с записью носителя
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyarrow huggingface_hub
      - run: python3 tests/cv-candidates.py cand
      - name: Положить в ветку phrase-candidates
        shell: bash
        run: |
          cd cand && git init -q && git checkout -q -b phrase-candidates
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Кандидаты в фразы с записью носителя"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" phrase-candidates
